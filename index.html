<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Steel Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #EFEADD;
    --charcoal: #1C1B19;
    --muted: #75706A;
    --brick: #A23E2E;
    --hair: #C8C0AC;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--cream);
    color: var(--charcoal);
    font-family: 'IBM Plex Mono', monospace;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .gate { width: 100%; max-width: 340px; text-align: center; }
  .mark { width: 72px; height: 72px; margin: 0 auto 22px; }
  .mark svg { width: 100%; height: 100%; fill: var(--charcoal); }
  .kicker {
    font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase;
    color: var(--charcoal); font-weight: 600;
  }
  .sub {
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--muted); margin-top: 6px;
  }
  form { margin-top: 28px; display: flex; border: 1.5px solid var(--charcoal); }
  input {
    flex: 1; min-width: 0;
    background: transparent; border: none; outline: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px; letter-spacing: 0.08em;
    color: var(--charcoal);
    padding: 12px 14px;
  }
  input::placeholder { color: var(--muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.2em; }
  button {
    background: var(--charcoal); color: var(--cream);
    border: none; cursor: pointer;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    padding: 0 18px;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .msg { margin-top: 14px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--brick); min-height: 14px; }
  .gate.err form { border-color: var(--brick); animation: shake 0.3s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
</style>
</head>

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  var gate = document.getElementById('gate');
  var form = document.getElementById('form');
  var input = document.getElementById('pw');
  var btn = document.getElementById('btn');
  var msg = document.getElementById('msg');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var password = input.value;
    if (!password) return;
    gate.classList.remove('err');
    msg.textContent = '';
    btn.disabled = true;
    btn.textContent = '...';

    var enc = new TextEncoder();
    crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'])
      .then(function (keyMaterial) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64ToBytes(SALT), iterations: 600000, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );
      })
      .then(function (key) {
        return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(IV) }, key, b64ToBytes(CT));
      })
      .then(function (plainBuf) {
        var html = new TextDecoder().decode(plainBuf);
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = 'Enter';
        gate.classList.add('err');
        msg.textContent = 'Not it. Try again.';
        input.select();
      });
  });
})();
